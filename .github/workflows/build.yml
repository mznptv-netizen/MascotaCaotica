name: Compilar Mascota a EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compilar ejecutable con PyInstaller
      run: |
        pyinstaller --onefile --noconsole --add-data "mascota.png;." --add-data "imagen_robo.png;." --add-data "imagenes_random;imagenes_random" src/mascota.py

    - name: Subir artefacto (.exe)
      uses: actions/upload-artifact@v4
      with:
        name: MascotaEjecutable
        path: dist/mascota.exe
